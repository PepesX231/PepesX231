name: Update stats cards
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']
  schedule:
    - cron: '17 0 * * *'   # every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git diff --cached --quiet || (git commit -m "Update stats cards" && git push)
