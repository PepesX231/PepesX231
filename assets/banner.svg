<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <style>
    .bg{fill:#0b0b0c}
    .big{font:900 150px 'Arial Black','Impact','Helvetica Neue',Arial,sans-serif;fill:#f6f6f3;letter-spacing:-4px}
    .th{font:700 30px 'Sukhumvit Set','Leelawadee UI','Tahoma',sans-serif;fill:#f6f6f3}
    .mono{font:500 17px 'SFMono-Regular','Consolas','Menlo',monospace;letter-spacing:4px;fill:#8a8a90}
    .blue{fill:#4da3ff}
    .sq{animation:bob 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(8deg)}}
    .blk{animation:blink 1.6s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .cell{animation:lit 4s ease-in-out infinite}
    @keyframes lit{0%,100%{opacity:.15}40%{opacity:1}}
  </style>
  <rect class="bg" width="1200" height="360" rx="18"/>
  <!-- the SMALL WINS block field -->
  <g transform="translate(760 40)">
    <g fill="#1f4e80">
      <rect class="cell" x="0" y="0" width="30" height="30" style="animation-delay:.1s"/><rect class="cell" x="38" y="0" width="30" height="30" style="animation-delay:.5s" fill="#4da3ff"/><rect class="cell" x="76" y="0" width="30" height="30" style="animation-delay:.9s"/><rect class="cell" x="114" y="0" width="30" height="30" style="animation-delay:1.3s"/><rect class="cell" x="152" y="0" width="30" height="30" style="animation-delay:1.7s" fill="#f6f6f3"/><rect class="cell" x="190" y="0" width="30" height="30" style="animation-delay:2.1s"/><rect class="cell" x="228" y="0" width="30" height="30" style="animation-delay:2.5s" fill="#4da3ff"/><rect class="cell" x="266" y="0" width="30" height="30" style="animation-delay:2.9s"/><rect class="cell" x="304" y="0" width="30" height="30" style="animation-delay:3.3s"/><rect class="cell" x="342" y="0" width="30" height="30" style="animation-delay:3.7s" fill="#4da3ff"/>
      <rect class="cell" x="38" y="38" width="30" height="30" style="animation-delay:.7s"/><rect class="cell" x="114" y="38" width="30" height="30" style="animation-delay:1.1s" fill="#4da3ff"/><rect class="cell" x="190" y="38" width="30" height="30" style="animation-delay:1.9s"/><rect class="cell" x="266" y="38" width="30" height="30" style="animation-delay:2.7s" fill="#f6f6f3"/><rect class="cell" x="342" y="38" width="30" height="30" style="animation-delay:3.5s"/>
      <rect class="cell" x="76" y="76" width="30" height="30" style="animation-delay:1.5s" fill="#4da3ff"/><rect class="cell" x="228" y="76" width="30" height="30" style="animation-delay:2.3s"/><rect class="cell" x="304" y="76" width="30" height="30" style="animation-delay:3.1s" fill="#4da3ff"/>
      <rect class="cell" x="152" y="114" width="30" height="30" style="animation-delay:2s"/><rect class="cell" x="342" y="114" width="30" height="30" style="animation-delay:3.9s"/>
    </g>
  </g>
  <text class="mono" x="60" y="78">HELLO, I'M · สวัสดีครับ ผม</text>
  <text class="big" x="52" y="215">PEEPEE</text>
  <rect class="blue sq" x="682" y="165" width="46" height="46"/>
  <text class="th" x="60" y="268">ชมน์ปภพ ดีจริง · Game Developer</text>
  <text class="mono" x="60" y="318"><tspan>FAIL FAST.</tspan><tspan class="blue" dx="14">LEARN FAST.</tspan><tspan class="blk" dx="6" fill="#4da3ff">▌</tspan></text>
</svg>
